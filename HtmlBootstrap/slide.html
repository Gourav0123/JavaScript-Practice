<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Subscription Popup</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* 🔥 Bootstrap default animation remove */
        .modal.fade .modal-dialog {
            transform: translateY(-100vh);
        }

        /* .custom-modal {} */

        /* Start: screen ke upar */
        /* .custom-modal {
            transform: translateY(0vh); 
            opacity: 0;
            transition: all 1.0ms ease-in-out;
        } */

        /* End: center pe ruk */
        .modal.show .custom-modal {
            transform: translateY(0);
            
            /* ✅ center */
            opacity: 1;
        }

        /* Optional styling */
        .modal-content {
            border-radius: 15px;
        }
    </style>
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <!-- Button -->
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#subModal">
        ADD
    </button>

    <!-- Modal -->
    <div class="modal fade" id="subModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered custom-modal">
            <div class="modal-content text-center p-4 shadow">

                <h3 class="mb-3 fw-medium">Pick your ideal plan</h3>
                <p class="mb-4">No Commitment & No hidden charges</p>

                <!-- <input type="email" class="form-control mb-3" placeholder="Enter your email">

                <button class="btn btn-success w-100 mb-2">Subscribe</button>
                <button class="btn btn-outline-secondary w-100" data-bs-dismiss="modal">Close</button> -->
                <div class="all cards">
                    <div class="card">
                        <div class="card-content">
                            <h4>Monthly Plans</h4>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-content">
                            <h4>Quaturly Plans</h4>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-content">
                            <h4>Yearly Plans</h4>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
